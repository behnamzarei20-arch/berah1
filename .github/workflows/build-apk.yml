name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare rate sheet assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          : > /tmp/nrate.b64
          for i in $(seq -w 1 136); do
            cat "assets/part-$i.b64" >> /tmp/nrate.b64
          done
          tr -d '\n\r' < /tmp/nrate.b64 | base64 -d > app/src/main/assets/nrate_assets.zip
          unzip -t app/src/main/assets/nrate_assets.zip >/dev/null
          echo "Asset archive verified: $(du -h app/src/main/assets/nrate_assets.zip | cut -f1)"

      - name: Install Android SDK 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nerkhnameh-1405-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

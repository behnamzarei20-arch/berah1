name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare rate sheet assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          : > /tmp/nrate.b64
          for i in $(seq -w 1 136); do
            cat "assets/part-$i.b64" >> /tmp/nrate.b64
          done
          tr -d '\n\r' < /tmp/nrate.b64 | base64 -d > app/src/main/assets/nrate_assets.zip
          unzip -t app/src/main/assets/nrate_assets.zip >/dev/null
          echo "Asset archive verified: $(du -h app/src/main/assets/nrate_assets.zip | cut -f1)"

      - name: Install Android SDK 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Create release signing key
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=RateSheet1405, OU=App, O=Local, L=Local, ST=Local, C=DE"

      - name: Build installable release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: release
          KEY_PASSWORD: android
        run: |
          gradle assembleRelease --stacktrace
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nerkhnameh-1405-installable-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
